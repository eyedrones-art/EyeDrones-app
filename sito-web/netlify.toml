# Sito eyedrones.it: pagine statiche, nessuna compilazione.
# Su Netlify: sito nuovo dallo stesso repository, con «Base directory» = sito-web
[build]
  publish = "."
  command = ""
  # pubblica solo quando cambia qualcosa in questa cartella (non a ogni modifica dell'app)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[headers]]
  for = "/font/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # nessun altro sito può mostrare il sito dentro una sua pagina; sempre https
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"

# vecchi indirizzi del sito Wix ancora noti a Google: portano alla pagina nuova (301 = spostata per sempre)
[[redirects]]
  from = "/servizi"
  to = "/#servizi"
  status = 301

[[redirects]]
  from = "/contatti"
  to = "/#contatti"
  status = 301
