<html lang="it">
<head>

<style>
/* Layout: lo schermo del radiocomando. In alto la camera del drone (16:9, come il video), gli stick sotto o ai lati */
:root {
  --fondo: #0d1217;
  --pannello: #151d25;
  --bordo: #2a3542;
  --testo: #eef2f5;
  --tenue: #93a1af;
  --ambra: #f0a43a;
  --rosso: #e0523d;
  --verde: #55c27a;
  --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --corpo: "Barlow", system-ui, -apple-system, sans-serif;
  --osd: "Share Tech Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--fondo); color: var(--testo); font-family: var(--corpo); overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: none; }
#app { position: relative; height: 100%; display: flex; flex-direction: column; }
#schermo { position: relative; flex: none; background: #000; margin: 0 auto; overflow: hidden; }
#schermo canvas.gl { display: block; width: 100%; height: 100%; }
#comandi { position: relative; flex: 1; min-height: 0; }
#cornice, #osd { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
@media (max-width: 430px) { #barra { gap: 3px; padding: 6px 5px; font-size: 11.5px; } #barra .tasto { padding: 4px 6px; font-size: 11.5px; } #rec { min-width: 50px; } #barra .dato { padding: 2px 4px; } }
@media (max-width: 370px) { #d2 { display: none; } }
#barra { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 5px; align-items: center; padding: 6px 8px; background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0)); font-family: var(--display); font-size: 12.5px; font-variant-numeric: tabular-nums; pointer-events: none; z-index: 2; }
#barra .dato { background: rgba(10, 14, 19, .55); border-radius: 5px; padding: 2px 6px; white-space: nowrap; }
#barra .dato b { color: var(--tenue); font-weight: 500; margin-right: 3px; }
#barra .spazio { flex: 1; }
#barra button { pointer-events: auto; }
.tasto { font-family: var(--display); font-weight: 700; font-size: 12.5px; color: var(--testo); background: rgba(10, 14, 19, .7); border: 1px solid var(--bordo); border-radius: 6px; padding: 4px 8px; cursor: pointer; white-space: nowrap; }
.tasto:focus-visible { outline: 2px solid var(--ambra); outline-offset: 1px; }
#rec { min-width: 60px; }
#rec.attivo { background: var(--rosso); border-color: var(--rosso); }
#avviso { position: absolute; left: 50%; top: 36px; transform: translateX(-50%); max-width: calc(100% - 24px); background: rgba(10, 14, 19, .85); border: 1px solid var(--ambra); font-family: var(--display); font-size: 13px; padding: 5px 10px; border-radius: 7px; text-align: center; pointer-events: none; transition: opacity .3s; z-index: 3; }
#missione { position: absolute; left: 8px; bottom: 8px; max-width: min(340px, calc(100% - 16px)); background: rgba(10, 14, 19, .72); border-left: 3px solid var(--ambra); border-radius: 0 7px 7px 0; padding: 6px 9px; font-size: 13px; line-height: 1.35; pointer-events: none; z-index: 2; }
#missione b { font-family: var(--display); display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ambra); }
#mappa { position: absolute; right: 8px; bottom: 8px; width: 74px; height: 74px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(10, 14, 19, .55); z-index: 2; }
.stick { position: absolute; width: 132px; height: 132px; border-radius: 50%; background: radial-gradient(circle, #1b252f 0 58%, #141c24 59%); border: 1px solid var(--bordo); touch-action: none; }
.stick .croce { position: absolute; inset: 14px; border-radius: 50%; }
.stick .croce::before, .stick .croce::after { content: ""; position: absolute; background: #2c3946; }
.stick .croce::before { left: 50%; top: 0; bottom: 0; width: 1px; }
.stick .croce::after { top: 50%; left: 0; right: 0; height: 1px; }
.stick .pomello { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4d5b68, #232c35 70%); box-shadow: 0 4px 10px rgba(0,0,0,.5), inset 0 0 0 2px #56636f; }
.stick .etichetta { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: 10.5px; letter-spacing: .08em; color: var(--tenue); pointer-events: none; }
.stick .su { top: -17px; }
.stick .giu { bottom: -30px; line-height: 1.25; white-space: nowrap; left: 50%; right: auto; transform: translateX(-50%); }
.stick .freccia { position: absolute; font-size: 22px; color: var(--ambra); opacity: 0; transition: opacity .3s; pointer-events: none; text-shadow: 0 0 8px rgba(240,164,58,.7); }
.stick .freccia.on { opacity: 1; animation: lampeggia 1.2s infinite; }
@keyframes lampeggia { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .stick .freccia.on { animation: none; } }
.stick .f-su { left: 50%; top: 2px; transform: translateX(-50%); } .stick .f-giu { left: 50%; bottom: 2px; transform: translateX(-50%); }
.stick .f-sx { left: 4px; top: 50%; transform: translateY(-50%); } .stick .f-dx { right: 4px; top: 50%; transform: translateY(-50%); }
#gimbal { position: absolute; width: 34px; height: 120px; border-radius: 17px; background: #141c24; border: 1px solid var(--bordo); touch-action: none; }
#gimbal i { position: absolute; left: 4px; right: 4px; height: 24px; border-radius: 12px; background: #3d4954; }
#gimbal span { position: absolute; left: 50%; top: -18px; transform: translateX(-50%); font-family: var(--display); font-size: 10.5px; color: var(--tenue); white-space: nowrap; }
#modo { position: absolute; font-family: var(--display); font-size: 11px; color: var(--tenue); text-align: center; pointer-events: none; white-space: nowrap; }
.velo { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding-block: 12px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); background: rgba(6, 9, 12, .82); overflow-y: auto; z-index: 6; touch-action: pan-y; }
.carta { width: 100%; max-width: 600px; background: var(--pannello); border: 1px solid var(--bordo); border-radius: 14px; padding: 18px; margin: auto; }
.occhiello { font-family: var(--display); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ambra); }
.carta h1, .carta h2, .carta h3 { font-family: var(--display); margin: 4px 0 8px; line-height: 1.08; text-wrap: balance; }
.carta h1 { font-size: 30px; } .carta h2 { font-size: 24px; } .carta h3 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); margin-top: 14px; }
.carta p { font-size: 14.5px; line-height: 1.5; color: #d2dae1; margin: 0 0 12px; }
.schede { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
.scheda-t { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--testo); background: #1b2530; border: 1px solid var(--bordo); border-radius: 20px; padding: 7px 13px; cursor: pointer; }
.scheda-t.on { background: var(--ambra); color: #10161d; border-color: var(--ambra); }
.scheda-t:focus-visible { outline: 2px solid var(--testo); outline-offset: 2px; }
.manovre { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 0 0 12px; }
.manovra { text-align: left; background: #1b2530; border: 1px solid var(--bordo); border-radius: 10px; padding: 10px; color: var(--testo); cursor: pointer; font: inherit; }
.manovra:hover, .manovra:focus-visible { border-color: var(--ambra); outline: none; }
.manovra b { display: block; font-family: var(--display); font-size: 15px; margin-bottom: 3px; }
.manovra span { font-size: 12.5px; color: var(--tenue); line-height: 1.35; display: block; }
.manovra em { font-style: normal; color: var(--ambra); font-family: var(--display); font-size: 13px; }
.barra-liv { height: 6px; border-radius: 3px; background: #1b2530; margin: 4px 0 12px; overflow: hidden; }
.barra-liv i { display: block; height: 100%; background: var(--ambra); border-radius: 3px; }
.livelli { display: grid; gap: 6px; margin: 0 0 12px; }
.livello { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; text-align: left; background: #1b2530; border: 1px solid var(--bordo); border-radius: 10px; padding: 9px 10px; color: var(--testo); font: inherit; cursor: pointer; }
.livello .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; background: #26323f; font-size: 14px; }
.livello b { display: block; font-family: var(--display); font-size: 15px; } .livello small { display: block; color: var(--tenue); font-size: 12px; margin-top: 2px; }
.livello em { font-style: normal; color: var(--ambra); font-family: var(--display); }
.livello.aperto { border-color: var(--ambra); } .livello.aperto .num { background: var(--ambra); color: #10161d; }
.livello.fatto .num { background: var(--verde); color: #10161d; }
.livello.chiuso { opacity: .5; cursor: default; }
.livello:focus-visible { outline: 2px solid var(--testo); outline-offset: 2px; }
.risposte { display: grid; gap: 7px; margin: 0 0 12px; }
.risposta { text-align: left; font: inherit; font-size: 15px; color: var(--testo); background: #1b2530; border: 1px solid var(--bordo); border-radius: 10px; padding: 11px 12px; cursor: pointer; }
.risposta.giusta { border-color: var(--verde); background: #183027; } .risposta.sbagliata { border-color: var(--rosso); background: #33201f; }
.risposta:disabled { cursor: default; color: var(--testo); }
.esito-ok { color: var(--verde); font-weight: 700; margin-bottom: 4px !important; } .esito-no { color: var(--rosso); font-weight: 700; margin-bottom: 4px !important; }
.telefono { width: 100%; max-width: 360px; margin: auto; background: #050608; border-radius: 34px; padding: 10px; box-shadow: 0 0 0 2px #262a33, 0 20px 50px rgba(0,0,0,.6); }
.tel-schermo { background: #0f1419; border-radius: 26px; overflow: hidden; min-height: 520px; display: flex; flex-direction: column; }
.tel-stato { display: flex; justify-content: space-between; padding: 8px 18px 4px; font-family: var(--display); font-size: 11px; color: #cbd3db; }
.tel-testa { display: flex; align-items: center; gap: 8px; padding: 6px 14px 10px; border-bottom: 1px solid #1f2933; }
.tel-testa .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--ambra); color: #10161d; display: grid; place-items: center; font-weight: 800; font-family: var(--display); font-size: 14px; }
.tel-testa b { font-family: var(--display); font-size: 15px; } .tel-testa small { display: block; color: var(--tenue); font-size: 11px; }
.tel-passi { display: flex; gap: 4px; padding: 8px 14px 0; } .tel-passi i { flex: 1; height: 3px; border-radius: 2px; background: #26323f; } .tel-passi i.on { background: var(--ambra); }
.tel-corpo { flex: 1; padding: 12px 14px 14px; font-size: 13.5px; line-height: 1.45; }
.tel-corpo h4 { font-family: var(--display); font-size: 17px; margin: 2px 0 8px; }
.tel-corpo p { margin: 0 0 10px; color: #d2dae1; }
.fumetto { background: #1b2530; border-radius: 14px 14px 14px 4px; padding: 9px 11px; margin: 0 0 10px; font-size: 13.5px; }
.fumetto small { display: block; color: var(--tenue); font-size: 11px; margin-bottom: 2px; }
.fumetto.mio { background: #3a2c14; border-radius: 14px 14px 4px 14px; margin-left: 30px; }
.opzione { display: block; width: 100%; text-align: left; font: inherit; font-size: 13.5px; color: var(--testo); background: #1b2530; border: 1px solid var(--bordo); border-radius: 12px; padding: 10px 11px; margin: 0 0 7px; cursor: pointer; }
.opzione b { font-family: var(--display); } .opzione small { display: block; color: var(--tenue); font-size: 12px; margin-top: 2px; }
.opzione.on { border-color: var(--ambra); box-shadow: 0 0 0 1px var(--ambra); } .opzione.no { opacity: .55; }
.opzione .prezzo { float: right; font-family: var(--display); color: var(--ambra); }
.zona { position: relative; height: 130px; border-radius: 12px; overflow: hidden; margin: 0 0 10px; background: repeating-linear-gradient(45deg, #1b2a22 0 14px, #1e2e25 14px 28px); }
.zona i { position: absolute; left: 50%; top: 50%; border-radius: 50%; transform: translate(-50%, -50%); }
.zona .area { width: 110px; height: 110px; } .zona .punto { width: 14px; height: 14px; background: var(--ambra); box-shadow: 0 0 0 4px rgba(240,164,58,.35); }
.semaforo { display: inline-block; font-family: var(--display); font-weight: 700; font-size: 12px; padding: 3px 9px; border-radius: 10px; margin-bottom: 6px; }
.spunta { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; color: var(--testo); background: #1b2530; border: 1px solid var(--bordo); border-radius: 10px; padding: 9px 10px; margin: 0 0 6px; cursor: pointer; }
.spunta span { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--bordo); display: grid; place-items: center; font-weight: 800; color: #10161d; flex: none; }
.spunta.on span { background: var(--verde); border-color: var(--verde); }
.tel-bott { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tel-bott button { flex: 1 1 120px; font-family: var(--display); font-weight: 700; font-size: 14px; border-radius: 12px; padding: 11px 10px; cursor: pointer; border: 1px solid var(--bordo); background: #1b2530; color: var(--testo); }
.tel-bott button.forte { background: var(--ambra); color: #10161d; border-color: var(--ambra); }
.tel-bott button:disabled { opacity: .45; cursor: default; }
.galleria { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 0 10px; }
.galleria div { position: relative; aspect-ratio: 16/9; border-radius: 8px; background: #26323f center / cover no-repeat; overflow: hidden; }
.galleria div.filigrana::after { content: "EyeDrones"; position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 13px; color: rgba(255,255,255,.55); transform: rotate(-18deg); }
.levetta { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #1f2933; }
.levetta input { width: 20px; height: 20px; accent-color: var(--ambra); }
.cassa { display: flex; justify-content: space-between; background: #1b2530; border-radius: 12px; padding: 10px 12px; margin: 0 0 10px; font-family: var(--display); }
.cassa b { color: var(--verde); font-size: 18px; }
#pro { position: absolute; right: 8px; top: 40px; z-index: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; pointer-events: none; }
#pro .riga-pro { display: flex; gap: 5px; }
#pro .tasto { pointer-events: auto; }
#pro .tasto.attivo { background: var(--ambra); color: #10161d; border-color: var(--ambra); }
#proInfo { font-family: var(--display); font-size: 12px; background: rgba(10, 14, 19, .72); border-radius: 6px; padding: 3px 8px; white-space: nowrap; }
#mappa.pro { width: 112px; height: 112px; border-radius: 10px; }
.nota { font-size: 13px; line-height: 1.45; color: #d2dae1; background: #1b2530; border-left: 3px solid var(--rosso); border-radius: 0 8px 8px 0; padding: 8px 10px; margin: 0 0 12px; }
.piccolo { font-size: 12.5px; color: var(--tenue); margin: 8px 0 0; }
.piccolo a { color: var(--ambra); }
.voti { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 6px; }
.voti li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; font-size: 14px; background: #1b2530; border-radius: 8px; padding: 7px 10px; }
.voti .ok { color: var(--verde); font-weight: 700; } .voti .no { color: var(--rosso); font-weight: 700; }
.voti .val { font-family: var(--display); font-variant-numeric: tabular-nums; color: var(--tenue); }
.stelle { font-size: 30px; color: var(--ambra); letter-spacing: 4px; margin: 0 0 6px; }
.riga { display: flex; gap: 8px; flex-wrap: wrap; }
.grande { flex: 1 1 140px; font-family: var(--display); font-weight: 700; font-size: 16px; color: #10161d; background: var(--ambra); border: none; border-radius: 10px; padding: 11px 14px; cursor: pointer; }
.secondario { flex: 1 1 140px; font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--testo); background: #1b2530; border: 1px solid var(--bordo); border-radius: 10px; padding: 11px 14px; cursor: pointer; }
.grande:focus-visible, .secondario:focus-visible { outline: 2px solid var(--testo); outline-offset: 2px; }
.clip { display: grid; grid-template-columns: 26px 1fr auto auto; gap: 8px; align-items: center; background: #1b2530; border: 1px solid var(--bordo); border-radius: 10px; padding: 8px 10px; margin: 0 0 6px; font-size: 14px; }
.clip input { width: 20px; height: 20px; accent-color: var(--ambra); }
.clip small { display: block; color: var(--tenue); font-size: 12px; }
.clip .st { color: var(--ambra); font-family: var(--display); }
.clip button { background: none; border: none; color: var(--tenue); font-size: 18px; cursor: pointer; padding: 2px 6px; }
#video { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
#video .titolo { position: absolute; left: 10px; top: 8px; font-family: var(--display); font-size: 12px; letter-spacing: .14em; color: #fff; background: rgba(0,0,0,.45); padding: 3px 8px; border-radius: 5px; }
#video .avanzamento { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--ambra); }
#nero { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 5; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; }
#nero div { font-family: var(--display); color: #fff; }
#nero .t1 { font-size: clamp(20px, 5vw, 40px); font-weight: 700; letter-spacing: .02em; }
#nero .t2 { font-size: clamp(11px, 2.4vw, 15px); letter-spacing: .3em; text-transform: uppercase; color: #d9c7a6; margin-top: 8px; }
#tastiVideo { position: absolute; right: 10px; top: 8px; z-index: 6; display: flex; gap: 6px; pointer-events: none; }
#tastiVideo button { pointer-events: auto; }
#tinta { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light; }
/* ---------- la sala di montaggio ---------- */
#sala .intro { position: absolute; inset: 0; z-index: 3; cursor: pointer; background: #0b0a12; }
#sala .intro canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#sala .salta { position: absolute; right: 12px; bottom: 12px; z-index: 1; font-family: var(--display); font-size: 12px; color: rgba(255,255,255,.7); background: rgba(0,0,0,.4); padding: 4px 9px; border-radius: 12px; }
#sala .monitor, #sala .scrivania, #sala .muro { animation: entra .6s ease-out both; }
@keyframes entra { from { opacity: 0; transform: scale(1.05); } }
@media (prefers-reduced-motion: reduce) { #sala .monitor, #sala .scrivania, #sala .muro { animation: none; } }
#sala { position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; overflow: hidden;
  background: radial-gradient(120% 70% at 18% 0%, rgba(124, 77, 255, .28), transparent 60%), radial-gradient(90% 60% at 92% 8%, rgba(0, 200, 220, .2), transparent 60%), linear-gradient(180deg, #14121c, #0c0b12 70%); }
#sala .led { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, #7c4dff, #00c8dc, #ff4d9d, #7c4dff); box-shadow: 0 0 18px 4px rgba(124, 77, 255, .55); }
#sala .muro { position: absolute; top: 12px; right: max(14px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: flex-end; font-size: 18px; opacity: .9; pointer-events: none; }
#sala .poster { font-family: var(--display); font-size: 9.5px; line-height: 1.2; letter-spacing: .08em; color: #cfc6ff; border: 1px solid rgba(207, 198, 255, .35); padding: 4px 6px; border-radius: 3px; background: rgba(20, 16, 40, .6); text-align: center; }
#sala .monitor { position: relative; margin-top: 40px; width: calc(100% - 16px); max-width: 1180px; flex: 1; min-height: 0; background: #07080b; border: 7px solid #050608; border-radius: 10px; box-shadow: 0 0 0 1px #262a33, 0 18px 40px rgba(0, 0, 0, .6), 0 0 60px rgba(124, 77, 255, .18); display: flex; flex-direction: column; overflow: hidden; }
#sala .monitor::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 30px; height: 3px; margin-left: -15px; border-radius: 2px; background: #2a2f38; }
#sala .scrivania { position: relative; width: 100%; height: 62px; flex: none; background: linear-gradient(180deg, #3a2a20, #2a1d15); box-shadow: inset 0 3px 0 #4a372a, 0 -4px 12px rgba(0, 0, 0, .5); }
#sala .piede { position: absolute; left: 50%; top: -1px; width: 90px; height: 10px; margin-left: -45px; background: #15171c; border-radius: 0 0 6px 6px; }
#sala .tastiera { position: absolute; left: 50%; top: 18px; width: min(260px, 52%); height: 26px; transform: translateX(-50%); border-radius: 5px; background: repeating-linear-gradient(90deg, #1c1f26 0 13px, #2b2f38 13px 15px), #1c1f26; box-shadow: 0 0 0 2px #111318, 0 0 14px rgba(0, 200, 220, .35); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const ridotto = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const leggi = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}"); } catch { return {}; } };
  const scrivi = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* niente */ } };
  const G = Math.PI / 180;
  const migliori = leggi("simulatore-stelle");
  const tempiFpv = leggi("simulatore-tempi-fpv");

  // ======================= la scena =======================
  const tela = $("tela");
  const renderer = new THREE.WebGLRenderer({ canvas: tela, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  const scena = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(52, 16 / 9, 0.2, 1400);
  camera.rotation.order = "YXZ";
  const luceCielo = new THREE.HemisphereLight("#ffe6c4", "#5d6f45", 0.85); scena.add(luceCielo);
  const sole = new THREE.DirectionalLight("#ffd29a", 1.1); sole.position.set(-120, 70, -60); scena.add(sole);
  let mondo = new THREE.Group(); scena.add(mondo);

  let semeC = 1; const caso = () => { semeC = (semeC * 16807) % 2147483647; return (semeC - 1) / 2147483646; };
  const mat = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, ...o });

  function cielo(alto, orizzonte, basso) {
    const c = document.createElement("canvas"); c.width = 4; c.height = 256;
    const x = c.getContext("2d"); const g = x.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0, alto); g.addColorStop(0.44, orizzonte); g.addColorStop(0.5, basso); g.addColorStop(1, basso);
    x.fillStyle = g; x.fillRect(0, 0, 4, 256);
    mondo.add(new THREE.Mesh(new THREE.SphereGeometry(1000, 24, 12), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), side: THREE.BackSide, fog: false })));
  }
  function terra(colori, base, strada) {
    const c = document.createElement("canvas"); c.width = c.height = 1024;
    const x = c.getContext("2d");
    x.fillStyle = base; x.fillRect(0, 0, 1024, 1024);
    for (let i = 0; i < 70; i++) {
      x.save(); x.translate(caso() * 1024, caso() * 1024); x.rotate((caso() - 0.5) * 0.5);
      x.fillStyle = colori[i % colori.length]; x.fillRect(-60, -40, 80 + caso() * 160, 60 + caso() * 140);
      x.strokeStyle = "rgba(60,70,40,.22)"; x.lineWidth = 1;
      for (let k = 0; k < 10; k++) { x.beginPath(); x.moveTo(-60, -40 + k * 14); x.lineTo(160, -40 + k * 14); x.stroke(); }
      x.restore();
    }
    if (strada) {
      x.strokeStyle = strada; x.lineWidth = 9; x.lineCap = "round";
      x.beginPath(); x.moveTo(512, 512); x.bezierCurveTo(540, 650, 470, 800, 520, 1024); x.stroke();
      x.fillStyle = strada; x.beginPath(); x.arc(512, 522, 26, 0, 7); x.fill();
    }
    const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), mat("#ffffff", { map: t }));
    m.rotation.x = -Math.PI / 2; mondo.add(m);
  }
  function colline(colore, n, d0, scala = 0.55) {
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2 + 0.3, d = d0 + (i % 3) * 50;
      const m = new THREE.Mesh(new THREE.SphereGeometry(90 + (i % 4) * 25, 16, 8), mat(colore));
      m.position.set(Math.cos(a) * d, -40, Math.sin(a) * d); m.scale.y = scala; mondo.add(m);
    }
  }
  // alberi tutti uguali (InstancedMesh): leggeri anche sul telefono. Restano anche come ostacoli
  let ostacoli = { scatole: [], alberi: [] };
  function alberi(lista, geo, colore, w, h) {
    const m = new THREE.InstancedMesh(geo, mat(colore), lista.length), o = new THREE.Object3D();
    lista.forEach(([x, z, k], i) => { o.position.set(x, (h * k) / 2, z); o.scale.set(w * k, h * k, w * k); o.updateMatrix(); m.setMatrixAt(i, o.matrix); ostacoli.alberi.push({ x, z, r: w * k * 0.8, h: h * k }); });
    mondo.add(m);
  }
  function scatola(w, h, d, x, y, z, colore, solida = true) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(colore)); m.position.set(x, y, z); mondo.add(m);
    if (solida) ostacoli.scatole.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2, y1: y + h / 2 });
    return m;
  }
  function chiesa() {
    const pietra = "#c9ab82", tetto = "#a24f35", scuro = "#3b2a22";
    scatola(10, 8, 18, 0, 4, 0, pietra);
    const falda = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 7.6, 18.6, 4, 1), mat(tetto));
    falda.rotation.x = Math.PI / 2; falda.rotation.y = Math.PI / 4; falda.scale.set(1, 1, 0.55); falda.position.set(0, 10, 0); mondo.add(falda);
    ostacoli.scatole.push({ x0: -5.5, x1: 5.5, z0: -9.3, z1: 9.3, y1: 12.5 });
    scatola(4.5, 20, 4.5, 6.8, 10, -5, pietra);
    const punta = new THREE.Mesh(new THREE.ConeGeometry(3.6, 5, 4), mat(tetto)); punta.position.set(6.8, 22.5, -5); punta.rotation.y = Math.PI / 4; mondo.add(punta);
    ostacoli.scatole.push({ x0: 4.5, x1: 9.1, z0: -7.3, z1: -2.7, y1: 25 });
    scatola(4.6, 2.2, 4.6, 6.8, 17.5, -5, scuro, false);
    scatola(2.6, 4, 0.3, 0, 2, 9.05, scuro, false);
    const ros = new THREE.Mesh(new THREE.CircleGeometry(1.1, 20), mat(scuro)); ros.position.set(0, 6.3, 9.06); mondo.add(ros);
  }
  function campagna(semeAlberi, coloreUlivi = "#6b8452") {
    semeC = semeAlberi;
    const cipressi = [], ulivi = [];
    for (let x = -26; x <= 26; x += 3.4) cipressi.push([x, 52, 1 + caso() * 0.15]);
    for (let z = 30; z < 120; z += 7) { cipressi.push([5.5, z, 0.9 + caso() * 0.2]); cipressi.push([-5.5, z + 3, 0.9 + caso() * 0.2]); }
    for (let i = 0; i < 240; i++) {
      const a = caso() * Math.PI * 2, d = 34 + caso() * 260, x = Math.cos(a) * d, z = Math.sin(a) * d;
      if (Math.abs(x) < 12 && z > 0) continue;
      if (Math.hypot(x - 40, z - 20) < 30 || Math.hypot(x + 30, z - 20) < 24) continue; // spazio per i portali FPV
      ulivi.push([x, z, 0.7 + caso() * 0.7]);
    }
    alberi(cipressi, new THREE.ConeGeometry(1, 1, 7), "#2f4a2c", 1.5, 13);
    alberi(ulivi, new THREE.SphereGeometry(1, 7, 5), coloreUlivi, 3.2, 4.6);
  }

  // persone: invitati in due file, sposi che escono dalla chiesa
  let persone = [], sposi = null, barca = null, schiuma = null, faro = null, tempoMondo = 0;
  function personaggio(colore, testa = "#e6c0a0") {
    const g = new THREE.Group();
    const corpo = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.36, 1.35, 8), mat(colore)); corpo.position.y = 0.68; corpo.userData.temp = 0.8; g.add(corpo);
    const t = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 6), mat(testa)); t.position.y = 1.55; t.userData.temp = 0.86; g.add(t);
    return g;
  }
  function posizioneSposi(t) { const k = Math.min(1, Math.max(0, t / 34)); return { x: 0, z: 10.5 + k * 26 }; }
  function posizioneBarca(t) { const a = t * 0.07 - 1.2; return { x: Math.cos(a) * 48, z: -95 + Math.sin(a) * 30, a }; }

  // ======================= gli scenari =======================
  const SCENARI = {
    chiesa: {
      nome: "Chiesa di campagna", breve: "Una chiesa di pietra tra cipressi e ulivi, al tramonto.",
      costruisci() {
        scena.background = new THREE.Color("#f2c58e"); scena.fog = new THREE.Fog("#f2c58e", 160, 520);
        cielo("#6f8fbf", "#d9b9a2", "#f5c286"); semeC = 7;
        terra(["#8aa45c", "#a5ad62", "#6f8c4b", "#b7a65f", "#93a85a"], "#7f9a55", "#cdbb95");
        colline("#6d8250", 9, 330); chiesa(); campagna(99);
        const lago = new THREE.Mesh(new THREE.CircleGeometry(26, 32), mat("#6f93a8")); lago.rotation.x = -Math.PI / 2; lago.position.set(-90, 0.05, -40); mondo.add(lago);
      },
      soggetto: () => new THREE.Vector3(0, 7, 0),
      portali: [[40, 5, 40, 0], [32, 6, 0, 0], [0, 30, -6, 90], [-32, 6, 0, 0], [-30, 5, 34, 0], [0, 4, 72, 0]],
      partenzaFpv: [40, 0.25, 70, 0],
    },
    matrimonio: {
      nome: "Matrimonio", breve: "Gli sposi escono dalla chiesa tra gli invitati. Non sorvolare le persone.",
      costruisci() {
        SCENARI.chiesa.costruisci();
        // fiori ai lati della porta e gli invitati in due file lungo il viale
        for (const x of [-2.2, 2.2]) { const f = new THREE.Mesh(new THREE.SphereGeometry(0.9, 8, 6), mat("#f4f1ea")); f.position.set(x, 0.9, 9.6); mondo.add(f); }
        const abiti = ["#2d3a55", "#6b2737", "#3b4a3a", "#8a6d4a", "#1f2630", "#5a3d6b", "#a24f6a", "#2e5b6b"];
        semeC = 31;
        for (let z = 13; z <= 30; z += 1.6) for (const lato of [-1, 1]) {
          const p = personaggio(abiti[Math.floor(caso() * abiti.length)]);
          p.position.set(lato * (3 + caso() * 1.2), 0, z + caso() * 0.6); p.rotation.y = lato * Math.PI / 2; mondo.add(p); persone.push(p);
        }
        sposi = new THREE.Group();
        const sposa = personaggio("#fbfaf7"); sposa.position.x = -0.45; const velo = new THREE.Mesh(new THREE.ConeGeometry(0.75, 1.4, 10), mat("#ffffff")); velo.position.y = 0.6; sposa.add(velo);
        const sposo = personaggio("#1b2230"); sposo.position.x = 0.45;
        sposi.add(sposa, sposo); mondo.add(sposi);
      },
      animazioni(t) { const p = posizioneSposi(t); sposi.position.set(p.x, 0, p.z); },
      soggetto: (t) => { const p = posizioneSposi(t); return new THREE.Vector3(p.x, 1.2, p.z); },
      persone: () => [...persone.map((p) => p.position), sposi.position],
      portali: [[40, 5, 40, 0], [32, 6, 0, 0], [0, 32, -6, 90], [-32, 6, 0, 0], [-30, 5, 34, 0], [24, 5, 70, 0]],
      partenzaFpv: [40, 0.25, 70, 0],
    },
    lago: {
      nome: "Lago di montagna", breve: "Una villa sul lago, il pontile e una barca che passa. Montagne intorno.",
      costruisci() {
        scena.background = new THREE.Color("#cfe0ee"); scena.fog = new THREE.Fog("#cfe0ee", 200, 620);
        cielo("#4f7fb8", "#bcd3e6", "#dbe7ef"); semeC = 17;
        terra(["#6f9150", "#7f9d58", "#5f8045", "#87a160"], "#6a8a4c", null);
        const acqua = new THREE.Mesh(new THREE.CircleGeometry(150, 48), new THREE.MeshPhongMaterial({ color: "#3f7f9f", shininess: 80, specular: "#9fc6dd" }));
        acqua.rotation.x = -Math.PI / 2; acqua.position.set(0, 0.08, -110); acqua.scale.set(1, 0.62, 1); mondo.add(acqua);
        for (let i = 0; i < 13; i++) {

  let primo = 0;
  function giro(t) {
    const dt = Math.min(0.05, (t - (primo || t)) / 1000); primo = t;
    if (intro) { animaIntro(dt); if (intro) { renderer.render(scrivania.sc, scrivania.cam); requestAnimationFrame(giro); return; } }
    if (proiezione) avanzaProiezione(dt);
    else {
      if (inVolo && !document.hidden) {
        tempoMondo += dt; animaMondo();
        modoFpv ? aggiornaFpv(dt) : aggiornaGps(dt);
        if (proStato && tipoPro()) aggiornaPro(dt);
        if (registra) {
          registra.punti.push(posaAttuale());
          const durata = tempoMondo - registra.punti[0].t;
          const limite = modoFpv ? 90 : tipoPro() ? 600 : 40;
          if (tipoPro() && durata >= limite - 60 && !registra.avvisato) { registra.avvisato = true; avviso("🔋 Batteria al 10%: ancora un minuto, poi il lavoro si chiude", 3500); }
          if (durata >= limite) fermaRegistrazione();
        }
      }
      posa(posaAttuale()); aggiornaStrumenti(); disegnaMappa(); disegnaOsd();
    }
    renderer.render(scena, camera);
    // la miniatura per la sala di montaggio, presa poco dopo l'inizio della ripresa
    if (registra && !registra.mini && registra.punti.length > 45) registra.mini = miniatura();
    requestAnimationFrame(giro);
  }

  let stickGasDito = false;
  function collegaStick(id, quale) {
    const base = $(id), pom = base.querySelector(".pomello"); let dito = null;
    const muovi = (e) => {
      const r = base.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, max = r.width / 2 - 22;
      let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy);
      if (d > max) { dx *= max / d; dy *= max / d; }
      stick[quale].x = dx / max; stick[quale].y = dy / max;
      pom.style.transform = `translate(${dx}px, ${dy}px)`;
    };
    base.addEventListener("pointerdown", (e) => { dito = e.pointerId; base.setPointerCapture(e.pointerId); if (quale === "S" && modoFpv) stickGasDito = true; muovi(e); e.preventDefault(); });
    base.addEventListener("pointermove", (e) => { if (e.pointerId === dito) muovi(e); });
    const lascia = (e) => {
      if (e.pointerId !== dito) return; dito = null;
      // in FPV lo stick del gas torna al centro solo di lato: in alto e in basso resta dove lo lasci
      if (quale === "S" && modoFpv) { stick.S.x = 0; const r = base.clientWidth / 2 - 22; pom.style.transform = `translate(0px, ${stick.S.y * r}px)`; return; }
      stick[quale].x = stick[quale].y = 0; pom.style.transform = "";
    };
    base.addEventListener("pointerup", lascia); base.addEventListener("pointercancel", lascia);
  }
  collegaStick("stickS", "S"); collegaStick("stickD", "D");
  {

  $("menu").onclick = menu;
  $("riprese").onclick = elencoRiprese;

  function finestra(html) { $("finestra").innerHTML = html; $("finestra").hidden = false; $("finestra").scrollTop = 0; inVolo = false; }
  function chiudiFinestra() { $("finestra").hidden = true; }
  function avviso(t, ms = 2400, raro) {
    if (raro && performance.now() - ultimoAvv < 1500) return;
    ultimoAvv = performance.now();
    const a = $("avviso"); a.textContent = t; a.style.opacity = 1; clearTimeout(avviso.t); avviso.t = setTimeout(() => { a.style.opacity = 0; }, ms);
  }

  // ======================= misure =======================
  const posOsd = { orizzontale: false, dim: 130 };
  function misura() {
    if (salaAperta) { misuraSala(); return; }
    const W = window.innerWidth, H = window.innerHeight, orizzontale = W > H * 1.15;
    const s = $("schermo"), cmd = $("comandi");
    let w = W, h = W * 9 / 16;
    if (orizzontale) { h = H; w = Math.min(W, H * 16 / 9); if (w < W) h = w * 9 / 16; }
    else if (h > H * 0.55) { h = H * 0.55; w = h * 16 / 9; }
    s.style.width = w + "px"; s.style.height = h + "px";
    renderer.setSize(w, h, false); camera.aspect = 16 / 9; camera.updateProjectionMatrix();
    const S = $("stickS"), D = $("stickD"), Gm = $("gimbal"), M = $("modo");
    const dim = Math.max(104, Math.min(150, Math.min(W, (orizzontale ? H : H - h)) * 0.36));
    for (const el of [S, D]) { el.style.width = el.style.height = dim + "px"; }
    posOsd.orizzontale = orizzontale; posOsd.dim = dim;
    if (orizzontale) {
      cmd.style.position = "absolute"; cmd.style.inset = "0"; cmd.style.pointerEvents = "none";
      for (const el of [S, D, Gm]) el.style.pointerEvents = "auto";
      Object.assign(S.style, { left: "max(26px, env(safe-area-inset-left, 0px))", bottom: "38px", top: "auto", right: "auto" });
      Object.assign(D.style, { right: "max(26px, env(safe-area-inset-right, 0px))", left: "auto", bottom: "38px", top: "auto" });
      Object.assign(Gm.style, { right: `calc(max(26px, env(safe-area-inset-right, 0px)) + ${dim / 2 - 17}px)`, left: "auto", bottom: dim + 66 + "px", top: "auto", marginLeft: "0" });
      Object.assign(M.style, { left: "50%", bottom: "8px", top: "auto", transform: "translateX(-50%)" });
      s.appendChild($("missione"));
      Object.assign($("missione").style, { top: "40px", bottom: "auto", left: "8px", right: "auto" });
      Object.assign($("mappa").style, { top: "auto", bottom: "30px", left: "50%", right: "auto", transform: "translateX(-50%)" });
      Object.assign($("avviso").style, { top: "auto", bottom: "112px" });
    } else {
      cmd.style.position = "relative"; cmd.style.inset = ""; cmd.style.pointerEvents = "";
      const libero = H - h, alto = Math.max(84, (libero - dim) / 2 + 20);
      Object.assign(S.style, { left: "max(30px, env(safe-area-inset-left, 0px))", top: alto + "px", bottom: "auto", right: "auto" });
      Object.assign(D.style, { right: "max(30px, env(safe-area-inset-right, 0px))", left: "auto", top: alto + "px", bottom: "auto" });
      Object.assign(Gm.style, { left: "50%", right: "auto", top: alto + dim / 2 - 60 + "px", bottom: "auto", marginLeft: "-17px" });
      Object.assign(M.style, { left: "50%", top: alto + dim / 2 + 70 + "px", bottom: "auto", transform: "translateX(-50%)" });
      cmd.appendChild($("missione"));
      Object.assign($("missione").style, { top: "8px", bottom: "auto", left: "max(12px, env(safe-area-inset-left, 0px))", right: "max(12px, env(safe-area-inset-right, 0px))" });
      Object.assign($("mappa").style, { top: "auto", bottom: "8px", left: "auto", right: "8px", transform: "" });
      Object.assign($("avviso").style, { top: $("pro").hidden ? "36px" : "118px", bottom: "auto" });
    }
    disegnaCornice(); window.mostraGimbal(); if (modoFpv) impostaComandi();
  }
  window.addEventListener("resize", misura);
  window.addEventListener("orientationchange", () => setTimeout(misura, 200));

  misura();
  costruisciScenario("chiesa", "reveal");
  inizia("reveal"); menu();
  requestAnimationFrame(giro);
})();
</script>
