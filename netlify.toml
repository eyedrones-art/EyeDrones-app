[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  included_files = ["netlify/functions/*.so.1", "netlify/functions/thermal-worker.js", "node_modules/dji-thermal-sdk/**"]

# il service worker e il manifest devono essere sempre quelli aggiornati
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# pagine partner: raggiungibili solo con il link, mai nei motori di ricerca
[[headers]]
  for = "/partner-*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# pagina pubblica del pilota: app.eyedrones.it/p/<nome> apre l'app, che mostra la pagina senza login
[[redirects]]
  from = "/p/*"
  to = "/index.html"
  status = 200
